<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IVC Seoul — Catholic Pilgrimage</title>
  <link rel="icon" type="image/png" href="ivclogo.png" />
  <link rel="apple-touch-icon" href="ivclogo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  
  <style>
    :root { --primary-red: #cc0000; --primary-blue: #003380; --easter-gold: #d4af37; --parchment: #FDFBF7; --parchment-dark: #F4EFE6; --dark-text: #2C2A29; --transition-smooth: 0.4s ease; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jost', 'Noto Sans KR', sans-serif; background-color: var(--parchment); color: var(--dark-text); background-image: radial-gradient(var(--parchment-dark) 1px, transparent 1px); background-size: 40px 40px; }

    nav { position: fixed; top: 0; width: 100%; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: rgba(253, 251, 247, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 2px 20px rgba(0,0,0,0.04); border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
    .nav-left { display: flex; gap: 8px; flex: 1; justify-content: flex-start; align-items: center; flex-wrap: wrap; }
    .logo-container { flex: 1; text-align: center; }
    .nav-right { flex: 1; text-align: right; }
    .logo { font-family: 'Cormorant Garamond', serif; font-weight: 700; color: var(--primary-blue); text-decoration: none; font-size: 1.6rem; letter-spacing: 1px; text-transform: uppercase; }
    
    .lang-btn { background: transparent; border: 1px solid rgba(212, 175, 55, 0.5); color: var(--primary-blue); width: 32px; height: 32px; border-radius: 50%; font-size: 0.85rem; font-weight: 600; font-family: 'Jost', 'Noto Sans KR', sans-serif; cursor: pointer; transition: var(--transition-smooth); display: flex; align-items: center; justify-content: center; padding: 0; }
    .lang-btn:hover, .lang-btn.active { background: var(--easter-gold); color: var(--white); border-color: var(--easter-gold); box-shadow: 0 4px 10px rgba(212,175,55,0.3); }
    
    .back-btn { background: transparent; border: 1px solid rgba(212, 175, 55, 0.5); color: var(--primary-blue); padding: 4px 12px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; font-family: 'Jost', sans-serif; text-decoration: none; transition: var(--transition-smooth); display: inline-block; }
    .back-btn:hover { background: var(--easter-gold); color: #fff; border-color: var(--easter-gold); box-shadow: 0 4px 10px rgba(212,175,55,0.3); }

    .page-header { padding: 150px 5% 60px; text-align: center; background: linear-gradient(180deg, rgba(0,51,128,0.05) 0%, transparent 100%); }
    .page-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; color: var(--primary-blue); margin-bottom: 15px; }
    .page-header p { font-size: 1.1rem; max-width: 700px; margin: 0 auto; color: #555; line-height: 1.6; }

    .gallery-container { max-width: 1200px; margin: 20px auto 80px; padding: 0 5%; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .photo-item { width: 100%; height: 280px; overflow: hidden; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
    .photo-item:hover img { transform: scale(1.08); }

    @media (max-width: 768px) {
      .nav-left { flex: 0 0 85px; flex-wrap: nowrap; overflow-x: auto; padding: 4px 0; gap: 6px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, black 60%, transparent 100%); mask-image: linear-gradient(to right, black 60%, transparent 100%); }
      .nav-left::-webkit-scrollbar { display: none; }
      .lang-btn { width: 32px; height: 32px; font-size: 0.75rem; flex-shrink: 0; scroll-snap-align: start; }
      .lang-btn.active { order: -1; } 
      .nav-right { flex: 0 0 85px; text-align: right; }
      .back-btn { padding: 4px 10px; font-size: 0.75rem; } 
      .logo { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-left">
      <button class="lang-btn active" data-lang="en" aria-label="English">EN</button>
      <button class="lang-btn" data-lang="ko" aria-label="Korean">한</button>
      <button class="lang-btn" data-lang="es" aria-label="Spanish">ES</button>
      <button class="lang-btn" data-lang="fr" aria-label="French">FR</button>
      <button class="lang-btn" data-lang="it" aria-label="Italian">IT</button>
      <button class="lang-btn" data-lang="zh" aria-label="Chinese">中</button>
    </div>
    <div class="logo-container">
      <a href="index.html" class="logo">IVC <span style="color: var(--easter-gold);">SEOUL</span></a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="back-btn" data-en="&larr; Back" data-ko="&larr; 뒤로" data-es="&larr; Volver" data-fr="&larr; Retour" data-it="&larr; Indietro" data-zh="&larr; 返回">&larr; Back</a>
    </div>
  </nav>

  <header class="page-header">
    <h1 data-en="Pilgrimages" data-ko="성지순례" data-es="Peregrinación" data-fr="Pèlerinage" data-it="Pellegrinaggio" data-zh="朝圣之旅">Pilgrimage</h1>
    <p data-en="Walking in the footsteps of the Korean martyrs and exploring holy sites to deepen our faith." 
       data-ko="한국 순교자들의 발자취를 따라 걸으며 신앙을 깊이 다지는 성지순례입니다."
       data-es="Caminando tras las huellas de los mártires coreanos y explorando lugares santos para profundizar nuestra fe."
       data-fr="Marcher sur les traces des martyrs coréens et explorer les lieux saints pour approfondir notre foi."
       data-it="Camminare sulle orme dei martiri coreani ed esplorare i luoghi santi per approfondire la nostra fede."
       data-zh="追随韩国殉道者的足迹，探索朝圣地，深化我们的信仰。">Walking in the footsteps of the Korean martyrs and exploring holy sites to deepen our faith.</p>
  </header>

  <main class="gallery-container">
    <div class="photo-grid">
      <div class="photo-item"><img src="pilgrimage1.jpg" alt="Pilgrimage" loading="lazy"></div>
      <div class="photo-item"><img src="pilgrimage2.jpg" alt="Pilgrimage" loading="lazy"></div>
      <div class="photo-item"><img src="pilgrimage3.jpg" alt="Pilgrimage" loading="lazy"></div>
      <div class="photo-item"><img src="pilgrimage4.jpg" alt="Pilgrimage" loading="lazy"></div>
      <div class="photo-item"><img src="pilgrimage5.jpg" alt="Pilgrimage" loading="lazy"></div>
      <div class="photo-item"><img src="pilgrimage6.jpg" alt="Pilgrimage" loading="lazy"></div>
       <div class="photo-item"><img src="pilgrimage7.jpg" alt="Pilgrimage" loading="lazy"></div>
       <div class="photo-item"><img src="pilgrimage8.jpg" alt="Pilgrimage" loading="lazy"></div>
    </div>
  </main>

  <footer>
    <div style="display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 25px;">
      <img src="ivclogo.png" alt="IVC Logo" style="width: 75px; height: 75px; border-radius: 50%; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05);" />
      <div style="width: 1px; height: 45px; background-color: rgba(0,0,0,0.1);"></div>
      <img src="archdioceseofseoul.png" alt="Archdiocese of Seoul Seal" style="width: 60px; height: 60px; border-radius: 50%; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05);" />
    </div>
    <p style="font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--primary-blue); margin-bottom: 8px;">IVC <span style="color: var(--easter-gold);">Seoul</span> ✝</p>
    <p style="font-weight: 500; font-size: 0.95rem; color: #777; font-family: 'Jost', sans-serif;">International Volunteers Community</p>
    <p style="margin-top: 8px; font-size: 0.85rem; color: #777; opacity: 0.7; font-family: 'Jost', sans-serif;">Under the Archdiocese of Seoul · 천주교 서울대교구</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentLang = localStorage.getItem('ivc-lang') || 'en';
      setLanguage(currentLang);
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          setLanguage(e.target.getAttribute('data-lang'));
          if(window.innerWidth <= 768) { document.querySelector('.nav-left').scrollLeft = 0; }
        });
      });
    });
    function setLanguage(lang) {
      localStorage.setItem('ivc-lang', lang); document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-lang') === lang));
      document.querySelectorAll(`[data-${lang}]`).forEach(el => el.innerText = el.getAttribute(`data-${lang}`));
    }
  </script>
</body>
</html>
